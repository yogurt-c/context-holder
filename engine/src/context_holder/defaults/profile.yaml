# 새 위키 레포의 config/profile.yaml 초깃값. 관련도 기준은 plan 5.1, 보정 근거는 engine/eval/README.md.
thresholds:
  save: 0.6   # 이 이상이면 위키에 저장 (M0 평가셋으로 보정)
  inbox: 0.3  # 이 이상이면 Inbox에 보류, 미만이면 버림

# 수집할 직군. 앱의 시작하기 · 설정에서 고른다. 직군별 기준은 앱의 defaults/roles.yaml.
# backend · frontend · ai · ml · infra · data · security
roles: [backend, frontend, ai, infra, data]

# 직군 기준 위에 더할 주제 (선택). 키워드가 아니라 주제 단위로 적는다.
# include:
#   - topic: 주제 이름
#     about: 무엇을 다루는 글인지
# borderline: []
# exclude: []
