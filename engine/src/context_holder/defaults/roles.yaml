# 직군 프리셋. profile.yaml의 roles에 고른 직군 id를 적으면 분류 기준을 이 파일로 만든다.
# 고른 직군은 수집 기준이 되고, 고르지 않은 직군은 그 직군에만 해당하는 글을 거르는 기준이 된다.
# 기본 선택은 기본 profile.yaml의 roles다. 기준은 plan 5.1.
common:  # 직군과 상관없이 늘 적용
  include:
    - topic: 개발 생산성
      about: >-
        테스트 전략, 코드 리뷰 · 리팩터링, AI 코딩 도구 활용, 사내 개발 플랫폼,
        CI/CD 활용, 관측성(로그 · 지표 · 트레이스)
  borderline:
    - topic: 기술 동향 정리
      about: 결정 사례 없이 언어 · 플랫폼 동향을 정리한 글
  exclude:
    - topic: 엔지니어링 외
      about: 디자인 작업 자체, 행사 홍보, 채용 공고, 조직문화, 회사 소식, 제품 출시 공지

roles:
  - id: backend
    name: 백엔드
    hint: 서버 · DB · 대규모 트래픽
    about: >-
      서버 아키텍처, 동시성, DB, 캐시, 메시징, API 설계, 대규모 트래픽, 배포, 장애 분석,
      검색 · 추천 서빙, 인증 · 인가 설계, 세션 · 토큰 관리, API 보안(레이트 리밋 · 입력 검증),
      시크릿 관리, 서비스 간 인증
  - id: frontend
    name: 프론트엔드 · 모바일
    hint: 웹 · 앱 성능 · 렌더링
    about: >-
      웹 성능, 렌더링, 상태 관리, 빌드 · 패키지 관리, 웹뷰, 디자인 시스템 구현,
      iOS · Android · 크로스플랫폼 아키텍처, 앱 성능 · 크기, 앱 릴리스 · 안정성,
      XSS · CSP, 웹뷰 보안, 클라이언트 토큰 저장, 앱 위변조 방지 · 난독화, npm 패키지 공급망 보안
  - id: ai
    name: AI 엔지니어링
    hint: LLM 서빙 · 에이전트 · MCP
    about: >-
      만들어진 모델을 서비스와 개발에 쓰는 일. LLM 비용 · 서빙, 에이전트 · MCP · 하네스,
      컨텍스트 설계, LLM 평가 체계, 프롬프트 인젝션 방어, 에이전트 권한 · 샌드박스,
      LLM 입출력의 데이터 유출 방지, 가드레일
  - id: ml
    name: ML
    hint: 모델 · 학습 · 추천 모델
    about: >-
      모델을 만들고 학습시키는 일. 모델 아키텍처 설계, 학습 · 파인튜닝, 비전 · 음성 모델, 논문 구현,
      학습 데이터 생성 · 합성, ML 파이프라인 · 플랫폼, 추천 · 검색 모델과 효과 측정 · 실험 설계,
      임베딩 · 모델의 서비스 통합, 학습 데이터 프라이버시, 모델 탈취 · 적대적 공격 대응, 모델 공급망
  - id: infra
    name: 인프라 · DevOps
    hint: 클라우드 · CI/CD · 관측성
    about: >-
      클라우드 · 쿠버네티스, 네트워크, CI/CD, 관측성, SRE, 인프라 비용,
      IAM · 최소 권한, 네트워크 격리 · 제로트러스트, 컨테이너 · 쿠버네티스 보안, 빌드 공급망 보안,
      침해 대응 체계
  - id: data
    name: 데이터 엔지니어링
    hint: 파이프라인 · 스트리밍
    about: >-
      데이터 파이프라인, 스트리밍, 웨어하우스 · 레이크, 데이터 품질 · 거버넌스,
      데이터 접근 제어, 개인정보 마스킹 · 암호화, 감사 로그, 데이터 보존 · 삭제 정책
  - id: security
    name: 보안
    hint: 위협 대응 · 취약점 분석
    about: >-
      위협 모델링, 탐지 · 대응(SOC), 침해 사고 분석, 침투 테스트, 암호화 설계,
      취약점 분석 · CVE 대응, 보안 공지 · 패치 안내
