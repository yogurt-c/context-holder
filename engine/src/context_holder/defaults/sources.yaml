# 새 위키 레포의 config/sources.yaml 초깃값. 선정 기준은 README "수집 대상 블로그"와 plan 5.1.
# mode: feed  = feed 본문 사용, 본문이 짧으면 원문 페이지를 가져온다
#       fetch = feed에 요약만 있어 항상 원문 페이지를 가져온다
# weight: Today 순위에 곱하는 회사 가중치. 없으면 1.0
# roles: 이 직군을 골랐을 때만 수집한다 (profile.yaml의 roles). 없으면 늘 수집
# archive: 첫 실행(ctx init) 때 feed보다 오래된 글 목록을 얻는 방법. 없으면 feed만 쓴다.
#   Medium(당근, 무신사, Airbnb, Netflix)과 Cloudflare는 아카이브를 막거나 목록이 없어 feed만 쓴다.
sources:
  - id: naver-d2
    name: NAVER D2
    region: domestic
    feed: https://d2.naver.com/d2.atom
    # 원문 페이지는 SPA라 본문이 없다. feed 본문이 짧을 때는 API에서 가져온다
    body_api:
      url: https://d2.naver.com/api/v1/contents/{id}
      id: /(?:helloworld|news)/(\d+)
      field: postHtml
    archive:
      kind: json
      url: https://d2.naver.com/api/v1/contents?page={page}&size=20
      first_page: 0
      items: content
      link: url
      link_base: https://d2.naver.com
      title: postTitle
      date: postPublishedAt
  - id: toss
    name: Toss
    region: domestic
    feed: https://toss.tech/rss.xml
    date_pattern: '(\d{4})년 (\d{1,2})월 (\d{1,2})일'
    archive:
      kind: html
      url: https://toss.tech/?page={page}
      link: /article/[a-z0-9-]+
      link_base: https://toss.tech
  - id: woowahan
    name: 우아한형제들
    region: domestic
    feed: https://techblog.woowahan.com/feed/
    archive: {kind: wp_paged}
  - id: line
    name: LINE (LY Corp)
    region: domestic
    feed: https://techblog.lycorp.co.jp/ko/feed/index.xml
    mode: fetch
  - id: daangn
    name: 당근
    region: domestic
    feed: https://medium.com/feed/daangn
  - id: oliveyoung
    name: 올리브영
    region: domestic
    feed: https://oliveyoung.tech/rss.xml
    mode: fetch
  - id: musinsa
    name: 무신사
    region: domestic
    feed: https://medium.com/feed/musinsa-tech
  - id: kakao
    name: Kakao
    region: domestic
    feed: https://tech.kakao.com/feed/
    mode: fetch
    # 원문 페이지는 SPA라 본문이 없어 API에서 가져온다
    body_api:
      url: https://tech.kakao.com/api/v1/posts/{id}
      id: /posts/(\d+)
      field: content
      title: title
      date: releaseDate
    archive:
      kind: sitemap
      url: https://tech.kakao.com/sitemap.xml
      link: 'https://tech\.kakao\.com/posts/(\d+)'
  - id: nhn-cloud
    name: NHN Cloud
    region: domestic
    feed: https://meetup.nhncloud.com/rss
    archive:
      kind: json
      url: https://meetup.nhncloud.com/tcblog/v1.0/posts?pageNo={page}&rowsPerPage=20
      items: posts
      link: https://meetup.nhncloud.com/posts/{postId}
      title: postPerLang.title
      date: publishTime
  - id: netflix
    name: Netflix
    region: overseas
    feed: https://netflixtechblog.com/feed
  - id: github
    name: GitHub
    region: overseas
    feed: https://github.blog/engineering/feed/
    archive: {kind: wp_paged}
  - id: cloudflare
    name: Cloudflare
    region: overseas
    feed: https://blog.cloudflare.com/rss/
    # 보안 공지 글도 분류기가 판정한다. 보안 직군을 고르지 않으면 낮은 점수를 받는다
  - id: airbnb
    name: Airbnb
    region: overseas
    feed: https://medium.com/feed/airbnb-engineering

  # ---------- 직군을 골랐을 때만 수집 ----------
  - id: meta
    name: Meta
    region: overseas
    feed: https://engineering.fb.com/feed/
    roles: [ml]
  - id: pinterest
    name: Pinterest
    region: overseas
    feed: https://medium.com/feed/pinterest-engineering
    roles: [ml]
  - id: google-research
    name: Google Research
    region: overseas
    feed: https://research.google/blog/rss/
    mode: fetch
    roles: [ml]
  - id: spotify
    name: Spotify
    region: overseas
    feed: https://engineering.atspotify.com/feed/
    mode: fetch
    roles: [ml]
  - id: shopify
    name: Shopify
    region: overseas
    feed: https://shopify.engineering/blog.atom
    mode: fetch
    roles: [frontend]
  - id: grab
    name: Grab
    region: overseas
    feed: https://engineering.grab.com/feed.xml
    roles: [frontend]
  - id: trailofbits
    name: Trail of Bits
    region: overseas
    feed: https://blog.trailofbits.com/feed/
    roles: [security]
  - id: github-security
    name: GitHub Security
    region: overseas
    feed: https://github.blog/security/feed/
    roles: [security]
