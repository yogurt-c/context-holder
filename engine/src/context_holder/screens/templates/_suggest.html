{# 검색창 추천: 빈 검색창이면 찾을 수 있는 주제 질문, 입력하면 글자 · 뜻으로 맞는 결정 주제 문장 #}
<p class="suggest-head">{{ "추천 검색어" if q else "이런 걸 찾을 수 있어요" }}</p>
<ul class="suggest-list" aria-label="추천 검색어">
  {% for s, url in items %}
  <li><a class="suggest-item" href="{{ url }}"><span class="suggest-text">{{ s.text }}</span>{% if s.kind != "topic" %}<span class="suggest-topic">{{ s.topic }}</span>{% endif %}</a></li>
  {% endfor %}
</ul>
