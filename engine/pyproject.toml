[project]
name = "context-holder-engine"
version = "0.1.0"
description = "빅테크 기술블로그를 수집해 위키로 정리하고 검색과 MCP로 제공하는 엔진"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
ctx = "context_holder.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_holder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=context_holder --cov-report=term-missing"

[tool.coverage.report]
omit = ["*/__main__.py"]
