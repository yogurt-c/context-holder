[project]
name = "context-holder-engine"
version = "0.1.3"
description = "빅테크 기술블로그를 수집해 위키로 정리하고 검색과 MCP로 제공하는 엔진"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.2",
    "fastembed>=0.9.1",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "keyring>=25.7.0",
    "mcp>=1.20",
    "numpy>=2.5.4",
    "pygit2>=1.18",
    "pyyaml>=6.0.3",
    "trafilatura>=2.3.1",
    "typer>=0.12",
    "uvicorn>=0.54.0",
]

[project.scripts]
ctx = "context_holder.cli:app"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "types-pyyaml>=6.0.12.20261103",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_holder"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# typer는 옵션을 인자 기본값으로 선언한다
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=context_holder --cov-report=term-missing"

[tool.coverage.report]
omit = ["*/__main__.py"]
