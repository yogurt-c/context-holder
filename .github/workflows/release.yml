name: release

# 태그(v0.1.0 등)를 올리면 서명 · 공증한 앱을 빌드해 GitHub 릴리스로 낸다.
# 수동 실행(workflow_dispatch)은 시험용이다: draft 릴리스로만 남긴다.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "릴리스 태그 (수동 시험용, 예: v0.0.0-ci-test)"
        required: false
        default: "v0.0.0-ci-test"

env:
  RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
  # 러너의 python.org Python(Python.framework)은 파일별 서명이 깨진다. 로컬 빌드와 같은 uv Python을 쓴다
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  build-mac:
    runs-on: macos-latest # Apple Silicon (arm64)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          app_version="$(jq -r .version app/src-tauri/tauri.conf.json)"
          engine_version="$(sed -n 's/^version = "\(.*\)"/\1/p' engine/pyproject.toml | head -1)"
          test "$RELEASE_TAG" = "v$app_version" || { echo "태그 $RELEASE_TAG ≠ 앱 v$app_version"; exit 1; }
          test "$app_version" = "$engine_version" || { echo "앱 $app_version ≠ 엔진 $engine_version"; exit 1; }

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Import Developer ID certificate into keychain
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.MAC_CERT_P12_BASE64 }}
          p12-password: ${{ secrets.MAC_CERT_PASSWORD }}

      - name: Find signing identity
        run: |
          set -euo pipefail
          identity="$(security find-identity -v -p codesigning | grep -o '"Developer ID Application: [^"]*"' | head -1 | tr -d '"')"
          test -n "$identity"
          echo "SIGNING_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Bundle engine
        working-directory: engine
        run: |
          uv sync --locked
          uv run pyinstaller packaging/ctx-engine.spec --noconfirm --log-level WARN \
            --distpath dist --workpath build/pyinstaller

      - name: Sign engine
        run: scripts/sign-engine.sh "$SIGNING_IDENTITY"

      - name: Smoke test signed engine
        working-directory: engine
        run: dist/ctx-engine/ctx-engine --version

      - name: Build, sign & notarize app
        working-directory: app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          override="$(jq -cn --arg id "$SIGNING_IDENTITY" '{bundle:{macOS:{signingIdentity:$id}}}')"
          npx -y @tauri-apps/cli@2 build --bundles app,dmg \
            --config src-tauri/tauri.bundle.conf.json --config "$override"

      - name: Sign & notarize dmg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          dmg="$(ls app/src-tauri/target/release/bundle/dmg/*.dmg)"
          codesign --force --timestamp --sign "$SIGNING_IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --timeout 30m
          xcrun stapler staple "$dmg"

      - name: Verify Gatekeeper
        run: |
          set -euo pipefail
          app="app/src-tauri/target/release/bundle/macos/context-holder.app"
          dmg="$(ls app/src-tauri/target/release/bundle/dmg/*.dmg)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
          "$app/Contents/Resources/engine/ctx-engine" --version

      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    needs: build-mac
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: release
      # 파일을 다 올린 뒤에 공개한다. 수동 시험은 draft로 남는다.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Context Holder ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          draft: true
          fail_on_unmatched_files: true
          files: release/*.dmg
      - name: Publish tagged release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
